id: ascii-only
language: Rust
severity: error
message: Non-ASCII character in Rust source. Only ASCII (0x00-0x7F) is allowed in code.
note: |
  Write source as pure ASCII: identifiers, string and character literals, and
  comments must not contain non-ASCII bytes. In prose, prefer plain ASCII
  punctuation such as a period, comma, or colon instead of ASCII dash or
  ellipsis substitutes.
rule:
  any:
    - kind: identifier
      regex: '[^\x00-\x7F]'
    - kind: string_literal
      regex: '[^\x00-\x7F]'
    - kind: raw_string_literal
      regex: '[^\x00-\x7F]'
    - kind: char_literal
      regex: '[^\x00-\x7F]'
    - kind: line_comment
      regex: '[^\x00-\x7F]'
    - kind: block_comment
      regex: '[^\x00-\x7F]'