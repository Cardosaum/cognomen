id: no-non-ascii-md
language: Markdown
severity: error
message: Non-ASCII character in Markdown. Only ASCII (0x00-0x7F) is allowed in .md files.
note: |
  .md files must be pure ASCII. In prose, prefer plain ASCII punctuation such
  as a period, comma, semicolon, or colon instead of ASCII dash or arrow
  substitutes.
files:
  - '*.md'
rule:
  all:
    - kind: document
    - regex: '[^\x00-\x7F]'