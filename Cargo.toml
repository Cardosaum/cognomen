[package]
name = "cognomen"
version = "0.5.1"
authors = ["Matheus Cardoso"]
edition = "2021"
# Without `clap`. That feature tracks clap's rustc floor (4.6 needs 1.85).
rust-version = "1.71.1"
license = "MIT OR Apache-2.0"
description = "Derive stable, case-configured string labels for enum variants."
repository = "https://github.com/Cardosaum/cognomen"
homepage = "https://github.com/Cardosaum/cognomen"
documentation = "https://docs.rs/cognomen"
readme = "README.md"
keywords = ["derive", "enum", "label", "string", "case"]
categories = ["development-tools::procedural-macro-helpers", "no-std"]
include = ["src/**/*", "Cargo.toml", "LICENSE-*", "README.md"]
publish = true

[workspace]
members = ["macros"]
resolver = "2"

[workspace.lints.rust]
missing_docs = "warn"

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde", "cognomen-macros/serde"]
# clap 4.4+; this feature follows clap's rustc floor, not the crate MSRV.
clap = ["dep:clap", "std"]

[dependencies]
cognomen-macros = { path = "macros", version = "0.5.1", default-features = false }
serde = { version = "1", optional = true, default-features = false }
clap = { version = "4.4", optional = true, default-features = false, features = [
    "std",
    "error-context",
    "help",
    "usage",
] }

[dev-dependencies]
trybuild = "1"
serde_json = "1"
rstest = "0.23"
clap = { version = "4.4", default-features = false, features = [
    "std",
    "derive",
    "error-context",
    "help",
    "usage",
] }

[[test]]
name = "trybuild"
required-features = ["std"]

[[test]]
name = "clap"
required-features = ["clap"]

[[test]]
name = "trybuild_clap"
required-features = ["clap"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
