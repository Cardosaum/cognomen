[package]
name = "cognomen"
version = "0.3.0"
authors = ["Matheus Cardoso"]
edition = "2021"
rust-version = "1.71.1"
license = "MIT OR Apache-2.0"
description = "Derive stable, case-configured string labels for unit-like enum variants."
repository = "https://github.com/Cardosaum/cognomen"
homepage = "https://github.com/Cardosaum/cognomen"
documentation = "https://docs.rs/cognomen"
readme = "README.md"
keywords = ["derive", "enum", "label", "string", "case"]
categories = ["development-tools::procedural-macro-helpers", "no-std"]
include = ["src/**/*", "Cargo.toml", "LICENSE-*", "README.md"]
publish = true

[workspace]
members = ["macros"]
resolver = "2"

[workspace.lints.rust]
missing_docs = "warn"

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde", "cognomen-macros/serde"]

[dependencies]
cognomen-macros = { path = "macros", version = "0.3.0", default-features = false }
serde = { version = "1", optional = true, default-features = false }

[dev-dependencies]
trybuild = "1"
serde_json = "1"

[[test]]
name = "trybuild"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
