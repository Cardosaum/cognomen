# ast-grep (AST grep) configuration for cognomen.
#
# Rules under `rules/` enforce source-hygiene conventions:
#   - `ascii-only`        non-ASCII characters are forbidden in Rust source.
#   - `no-non-ascii-md`   non-ASCII characters (incl. em dashes) are forbidden
#                         in Markdown.
#
# Run locally:
#   ast-grep scan           # lint the whole repo
#   ast-grep test           # run the rule test-suite under rule-tests/
ruleDirs:
  - rules

testConfigs:
  - testDir: rule-tests